<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Saintes - Mobilité 3D</title>

  <!-- Connexions préparées dès l'ouverture pour réduire la latence initiale. -->
  <link rel="preconnect" href="https://js.arcgis.com" crossorigin />
  <link rel="preconnect" href="https://saintongeromane.maps.arcgis.com" crossorigin />
  <link rel="preconnect" href="https://services9.arcgis.com" crossorigin />
  <link rel="dns-prefetch" href="//js.arcgis.com" />
  <link rel="dns-prefetch" href="//saintongeromane.maps.arcgis.com" />
  <link rel="dns-prefetch" href="//services9.arcgis.com" />

  <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css" />
  <script type="module" src="https://js.arcgis.com/5.1/"></script>

  
  <link id="appStyles" rel="stylesheet" />
  <script>
    (() => {
      const link = document.getElementById("appStyles");
      link.href = "./styles.css?v=" + Date.now();
    })();
  </script>

  <script>
    // Supprime seulement les paramètres de suivi ajoutés aux liens.
    (() => {
      const url = new URL(window.location.href);
      let changed = false;

      for (const key of [...url.searchParams.keys()]) {
        if (key.toLowerCase().startsWith("utm_")) {
          url.searchParams.delete(key);
          changed = true;
        }
      }

      if (changed) {
        window.history.replaceState(
          {},
          document.title,
          url.pathname + (url.search || "") + url.hash
        );
      }
    })();
  </script>
</head>

<body>
  <div id="viewDiv"></div>

  <div id="cinemaGrade" class="neutral"></div>
  <div id="filmGrain"></div>
  <div id="sunRays"></div>
  <div id="nightTint"></div>
  <canvas id="starCanvas"></canvas>
  <canvas id="weatherCanvas"></canvas>
  <div id="lightningFlash"></div>

  <div id="slidePresentation" class="none">
    <div id="presentationTitle"></div>
    <div id="presentationDescription"></div>
  </div>

  <div id="slideControls" style="display:flex;">
    <button id="prevSlide" type="button" title="Diapositive précédente" aria-label="Diapositive précédente">‹</button>
    <button id="nextSlide" type="button" title="Diapositive suivante" aria-label="Diapositive suivante">›</button>
  </div>

  <script type="module">
    import("./app.js?v=" + Date.now());
  </script>
</body>
</html>
