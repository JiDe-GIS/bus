<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saintes - Trafic 3D</title>

  <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css" />
  <script type="module" src="https://js.arcgis.com/5.1/"></script>

  <style>
    html, body, #viewDiv {
      padding: 0;
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #info {
      position: absolute;
      top: 15px;
      left: 70px;
      z-index: 100;
      min-width: 245px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      font-family: "Avenir Next", Avenir, Arial, sans-serif;
      font-size: 14px;
    }

    #title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    #status {
      color: #555;
      font-size: 13px;
    }

    #status.ok {
      color: #237804;
    }

    #status.error {
      color: #b00020;
      font-weight: 700;
    }
  </style>

  <script>
    // Nettoie uniquement les paramètres de suivi ajoutés à l'URL.
    // On conserve code/state lors du retour OAuth.
    (() => {
      const url = new URL(window.location.href);
      let changed = false;

      for (const key of [...url.searchParams.keys()]) {
        if (key.toLowerCase().startsWith("utm_")) {
          url.searchParams.delete(key);
          changed = true;
        }
      }

      if (changed) {
        window.history.replaceState(
          {},
          document.title,
          url.pathname + (url.search || "") + url.hash
        );
      }
    })();
  </script>
</head>

<body>
  <div id="viewDiv"></div>

  <div id="info">
    <div id="title">Mobilité 3D — Saintes</div>
    <div id="status">Initialisation...</div>
  </div>

  <script type="module">
    // ==========================================================
    // CONFIGURATION
    // ==========================================================

    const PORTAL_URL =
      "https://saintongeromane.maps.arcgis.com";

    const CLIENT_ID =
      "uVV1afs1BldtPI0l";

    const WEBSCENE_ID =
      "a874e00cced24ca6becd5f307189fcb3";

    const AXE_ROUTE_ITEM_ID =
      "1328f11571aa43c4a62aec9c43f5824f";

    const WEB_STYLE =
      "EsriRealisticTransportationStyle";

    // Véhicules routiers : posé sur Ground / Integrated Mesh.
    const ROAD_VERTICAL_OFFSET =
      0.10;

    // Bateau : couche séparée.
    // relative-to-scene recherche d'abord les surfaces 3D de la scène.
    const BOAT_VERTICAL_OFFSET =
      0.30;

    // Distance utilisée pour lisser l'orientation dans les virages.
    const HEADING_LOOK_AHEAD_METERS =
      4;

    // Mapping par ID_VEH.
    // MODELE reste prioritaire si tu renseignes plus tard ce champ.
    const MODEL_BY_ID = {
      "01": "Bus",
      "02": "Audi_A6",
      "03": "BMW_3-Series",
      "04": "Ford_Edge",
      "05": "Semi_Trailer_Truck",
      "06": "Ford_Fiesta",
      "07": "Bus",
      "08": "Ford_Focus_Hatchback",
      "09": "Ford_Fusion",
      "10": "Ford_Mustang",
      "11": "Mercedes_S-Class",
      "12": "Toyota_Prius",
      "13": "Motorboat"
    };

    const FALLBACK_MODEL_BY_TYPE = {
      "CAR": "Taxi",
      "BUS": "Bus",
      "TRUCK": "Delivery_Truck",
      "BOAT": "Motorboat"
    };

    // ==========================================================
    // ÉTAT UI
    // ==========================================================

    function setStatus(message, type = "") {
      const element = document.getElementById("status");
      element.innerText = message;
      element.className = type;
    }

    // ==========================================================
    // IMPORTS
    // ==========================================================

    const [
      esriConfig,
      OAuthInfo,
      identityManager,
      WebScene,
      SceneView,
      FeatureLayer,
      GraphicsLayer,
      Graphic,
      Point,
      WebStyleSymbol
    ] = await $arcgis.import([
      "@arcgis/core/config.js",
      "@arcgis/core/identity/OAuthInfo.js",
      "@arcgis/core/identity/IdentityManager.js",
      "@arcgis/core/WebScene.js",
      "@arcgis/core/views/SceneView.js",
      "@arcgis/core/layers/FeatureLayer.js",
      "@arcgis/core/layers/GraphicsLayer.js",
      "@arcgis/core/Graphic.js",
      "@arcgis/core/geometry/Point.js",
      "@arcgis/core/symbols/WebStyleSymbol.js"
    ]);

    esriConfig.portalUrl =
      PORTAL_URL;

    // ==========================================================
    // OAUTH
    // ==========================================================

    const oauthInfo =
      new OAuthInfo({
        appId: CLIENT_ID,
        portalUrl: PORTAL_URL,
        popup: false,
        flowType: "auto",
        preserveUrlHash: true
      });

    identityManager.registerOAuthInfos([
      oauthInfo
    ]);

    async function authenticate() {
      try {
        setStatus(
          "Vérification de la connexion..."
        );

        try {
          await identityManager.checkSignInStatus(
            PORTAL_URL + "/sharing"
          );

          console.log(
            "Utilisateur déjà authentifié."
          );
        }
        catch (error) {
          console.log(
            "Authentification nécessaire."
          );

          setStatus(
            "Connexion ArcGIS Online..."
          );

          await identityManager.getCredential(
            PORTAL_URL + "/sharing"
          );
        }

        // Nettoyage visuel code/state après validation OAuth.
        const url =
          new URL(window.location.href);

        if (
          url.searchParams.has("code") ||
          url.searchParams.has("state")
        ) {
          url.searchParams.delete("code");
          url.searchParams.delete("state");

          window.history.replaceState(
            {},
            document.title,
            url.pathname + (url.search || "") + url.hash
          );
        }

        return true;
      }
      catch (error) {
        console.error(
          "Erreur authentification :",
          error
        );

        setStatus(
          "Erreur authentification",
          "error"
        );

        throw error;
      }
    }

    // ==========================================================
    // OUTILS GÉOMÉTRIQUES
    // ==========================================================

    function normalizeId(value) {
      return String(
        value ?? ""
      )
        .trim()
        .padStart(2, "0");
    }

    function normalizeType(value) {
      return String(
        value ?? ""
      )
        .trim()
        .toUpperCase();
    }

    function distanceMeters(
      x1,
      y1,
      x2,
      y2,
      spatialReference
    ) {
      if (
        spatialReference.isGeographic
      ) {
        const R =
          6371008.8;

        const toRad =
          Math.PI / 180;

        const phi1 =
          y1 * toRad;

        const phi2 =
          y2 * toRad;

        const deltaPhi =
          (y2 - y1) * toRad;

        const deltaLambda =
          (x2 - x1) * toRad;

        const a =
          Math.sin(deltaPhi / 2) ** 2
          +
          Math.cos(phi1)
          *
          Math.cos(phi2)
          *
          Math.sin(deltaLambda / 2) ** 2;

        const c =
          2
          *
          Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
          );

        return R * c;
      }

      const dx =
        x2 - x1;

      const dy =
        y2 - y1;

      const metersPerUnit =
        spatialReference.metersPerUnit || 1;

      return (
        Math.sqrt(
          dx * dx +
          dy * dy
        )
        *
        metersPerUnit
      );
    }

    function bearingDegrees(
      x1,
      y1,
      x2,
      y2,
      spatialReference
    ) {
      if (
        !spatialReference.isGeographic
      ) {
        const dx =
          x2 - x1;

        const dy =
          y2 - y1;

        let angle =
          Math.atan2(
            dx,
            dy
          )
          *
          180
          /
          Math.PI;

        return (
          angle +
          360
        ) % 360;
      }

      const toRad =
        Math.PI / 180;

      const toDeg =
        180 / Math.PI;

      const phi1 =
        y1 * toRad;

      const phi2 =
        y2 * toRad;

      const deltaLambda =
        (x2 - x1) * toRad;

      const y =
        Math.sin(deltaLambda)
        *
        Math.cos(phi2);

      const x =
        Math.cos(phi1)
        *
        Math.sin(phi2)
        -
        Math.sin(phi1)
        *
        Math.cos(phi2)
        *
        Math.cos(deltaLambda);

      let angle =
        Math.atan2(
          y,
          x
        )
        *
        toDeg;

      return (
        angle +
        360
      ) % 360;
    }

    function shortestAngleDelta(
      from,
      to
    ) {
      return (
        (
          to -
          from +
          540
        ) % 360
      ) - 180;
    }

    function buildRoute(
      path,
      spatialReference
    ) {
      const segments = [];
      let totalLength = 0;

      for (
        let i = 0;
        i < path.length - 1;
        i++
      ) {
        const p1 =
          path[i];

        const p2 =
          path[i + 1];

        const length =
          distanceMeters(
            p1[0],
            p1[1],
            p2[0],
            p2[1],
            spatialReference
          );

        if (
          length <= 0.001
        ) {
          continue;
        }

        segments.push({
          p1,
          p2,
          length,
          startDistance:
            totalLength
        });

        totalLength +=
          length;
      }

      return {
        segments,
        totalLength
      };
    }

    function pointAtDistance(
      route,
      distance
    ) {
      distance =
        Math.max(
          0,
          Math.min(
            route.totalLength,
            distance
          )
        );

      let segment =
        route.segments[
          route.segments.length - 1
        ];

      for (
        const candidate
        of route.segments
      ) {
        if (
          distance >=
            candidate.startDistance
          &&
          distance <=
            candidate.startDistance +
            candidate.length
        ) {
          segment =
            candidate;
          break;
        }
      }

      const localDistance =
        distance -
        segment.startDistance;

      const t =
        Math.max(
          0,
          Math.min(
            1,
            localDistance /
            segment.length
          )
        );

      return {
        x:
          segment.p1[0]
          +
          (
            segment.p2[0] -
            segment.p1[0]
          )
          *
          t,

        y:
          segment.p1[1]
          +
          (
            segment.p2[1] -
            segment.p1[1]
          )
          *
          t
      };
    }

    function smoothHeading(
      route,
      distance,
      spatialReference
    ) {
      const beforeDistance =
        Math.max(
          0,
          distance -
          HEADING_LOOK_AHEAD_METERS
        );

      const afterDistance =
        Math.min(
          route.totalLength,
          distance +
          HEADING_LOOK_AHEAD_METERS
        );

      const before =
        pointAtDistance(
          route,
          beforeDistance
        );

      const after =
        pointAtDistance(
          route,
          afterDistance
        );

      return bearingDegrees(
        before.x,
        before.y,
        after.x,
        after.y,
        spatialReference
      );
    }

    // ==========================================================
    // PROGRAMME PRINCIPAL
    // ==========================================================

    async function main() {
      try {
        await authenticate();

        setStatus(
          "Chargement de Saintes..."
        );

        const webscene =
          new WebScene({
            portalItem: {
              id:
                WEBSCENE_ID
            }
          });

        // ------------------------------------------------------
        // Deux couches graphiques :
        // - route : voitures, bus, camion
        // - bateau : placement vertical indépendant
        // ------------------------------------------------------

        const roadVehicleLayer =
          new GraphicsLayer({
            title:
              "Véhicules animés",

            elevationInfo: {
              mode:
                "relative-to-ground",

              offset:
                ROAD_VERTICAL_OFFSET
            }
          });

        const boatLayer =
          new GraphicsLayer({
            title:
              "Bateau animé",

            elevationInfo: {
              mode:
                "relative-to-scene",

              offset:
                BOAT_VERTICAL_OFFSET
            }
          });

        webscene.addMany([
          roadVehicleLayer,
          boatLayer
        ]);

        const view =
          new SceneView({
            container:
              "viewDiv",

            map:
              webscene,

            qualityProfile:
              "high"
          });

        await view.when();

        console.log(
          "WebScene chargée."
        );

        console.log(
          "SCR SceneView WKID :",
          view.spatialReference.wkid,
          "latestWkid :",
          view.spatialReference.latestWkid,
          "unité :",
          view.spatialReference.unit,
          "mètres/unité :",
          view.spatialReference.metersPerUnit
        );

        // ======================================================
        // AXEROUTE
        // ======================================================

        setStatus(
          "Chargement des itinéraires..."
        );

        const axeLayer =
          new FeatureLayer({
            portalItem: {
              id:
                AXE_ROUTE_ITEM_ID
            },

            layerId:
              0,

            outFields: [
              "ID_VEH",
              "TYPE_V",
              "MODELE",
              "VITESSE",
              "DEPART_PC",
              "ACTIF"
            ]
          });

        await axeLayer.load();

        const query =
          axeLayer.createQuery();

        query.where =
          "ACTIF = 1";

        query.returnGeometry =
          true;

        query.outFields = [
          "ID_VEH",
          "TYPE_V",
          "MODELE",
          "VITESSE",
          "DEPART_PC",
          "ACTIF"
        ];

        query.outSpatialReference =
          view.spatialReference;

        const result =
          await axeLayer.queryFeatures(
            query
          );

        console.log(
          "Véhicules actifs trouvés :",
          result.features.length
        );

        if (
          result.features.length === 0
        ) {
          throw new Error(
            "Aucun véhicule ACTIF = 1 dans AxeRoute."
          );
        }

        // ======================================================
        // CACHE DES MODÈLES ESRI
        // ======================================================

        const symbolCache =
          new Map();

        async function fetchVehicleSymbol(
          symbolName,
          type
        ) {
          if (
            symbolCache.has(
              symbolName
            )
          ) {
            return symbolCache
              .get(symbolName)
              .clone();
          }

          try {
            const webStyleSymbol =
              new WebStyleSymbol({
                styleName:
                  WEB_STYLE,

                name:
                  symbolName
              });

            const resolved =
              await webStyleSymbol
                .fetchSymbol();

            symbolCache.set(
              symbolName,
              resolved.clone()
            );

            return resolved;
          }
          catch (error) {
            console.warn(
              "Modèle introuvable :",
              symbolName,
              "=> fallback",
              error
            );

            const fallbackName =
              FALLBACK_MODEL_BY_TYPE[type]
              ||
              "Taxi";

            const fallback =
              new WebStyleSymbol({
                styleName:
                  WEB_STYLE,

                name:
                  fallbackName
              });

            const resolved =
              await fallback.fetchSymbol();

            symbolCache.set(
              fallbackName,
              resolved.clone()
            );

            return resolved;
          }
        }

        // ======================================================
        // CRÉATION DE TOUS LES VÉHICULES
        // ======================================================

        const vehicles =
          [];

        for (
          const feature
          of result.features
        ) {
          try {
            const attrs =
              feature.attributes;

            const id =
              normalizeId(
                attrs.ID_VEH
              );

            const type =
              normalizeType(
                attrs.TYPE_V
              );

            const geometry =
              feature.geometry;

            if (
              !geometry?.paths?.length
              ||
              geometry.paths[0].length < 2
            ) {
              console.warn(
                "Route ignorée, géométrie invalide :",
                id
              );
              continue;
            }

            if (
              geometry.paths.length > 1
            ) {
              console.warn(
                "Route multipart : seul le premier path est utilisé :",
                id
              );
            }

            const route =
              buildRoute(
                geometry.paths[0],
                view.spatialReference
              );

            if (
              route.totalLength <= 0
            ) {
              console.warn(
                "Route de longueur nulle :",
                id
              );
              continue;
            }

            const modelFromField =
              String(
                attrs.MODELE ?? ""
              ).trim();

            const symbolName =
              modelFromField
              ||
              MODEL_BY_ID[id]
              ||
              FALLBACK_MODEL_BY_TYPE[type]
              ||
              "Taxi";

            const speedKmhRaw =
              Number(
                attrs.VITESSE
              );

            const speedKmh =
              Number.isFinite(
                speedKmhRaw
              )
              &&
              speedKmhRaw > 0
              ?
              speedKmhRaw
              :
              (
                type === "BOAT"
                ? 15
                : 30
              );

            const departPcRaw =
              Number(
                attrs.DEPART_PC
              );

            const departPc =
              Number.isFinite(
                departPcRaw
              )
              ?
              Math.max(
                0,
                Math.min(
                  100,
                  departPcRaw
                )
              )
              :
              0;

            const startDistance =
              route.totalLength
              *
              departPc
              /
              100;

            const position =
              pointAtDistance(
                route,
                startDistance
              );

            const initialHeading =
              smoothHeading(
                route,
                startDistance,
                view.spatialReference
              );

            const symbol =
              (
                await fetchVehicleSymbol(
                  symbolName,
                  type
                )
              ).clone();

            if (
              !symbol.symbolLayers
              ||
              symbol.symbolLayers.length === 0
            ) {
              console.warn(
                "Symbole sans symbolLayer :",
                id,
                symbolName
              );
              continue;
            }

            const objectLayer =
              symbol.symbolLayers
                .getItemAt(0);

            objectLayer.heading =
              initialHeading;

            objectLayer.castShadows =
              true;

            const graphic =
              new Graphic({
                geometry:
                  new Point({
                    x:
                      position.x,

                    y:
                      position.y,

                    spatialReference:
                      view.spatialReference
                  }),

                symbol:
                  symbol,

                attributes: {
                  ID_VEH:
                    id,

                  TYPE_V:
                    type,

                  MODELE:
                    symbolName,

                  VITESSE:
                    speedKmh
                }
              });

            const targetLayer =
              type === "BOAT"
              ?
              boatLayer
              :
              roadVehicleLayer;

            targetLayer.add(
              graphic
            );

            vehicles.push({
              id,
              type,
              symbolName,
              speedKmh,
              speedMs:
                speedKmh / 3.6,
              route,
              startDistance,
              graphic,
              lastRenderedHeading:
                initialHeading
            });

            console.log(
              "Créé :",
              id,
              type,
              symbolName,
              speedKmh + " km/h",
              "longueur route :",
              route.totalLength.toFixed(1) + " m"
            );
          }
          catch (vehicleError) {
            console.error(
              "Erreur création véhicule :",
              feature.attributes,
              vehicleError
            );
          }
        }

        if (
          vehicles.length === 0
        ) {
          throw new Error(
            "Aucun véhicule n'a pu être créé."
          );
        }

        // ======================================================
        // ROTATION 3D
        // ======================================================

        function updateVehicleHeading(
          vehicle,
          targetHeading
        ) {
          const delta =
            shortestAngleDelta(
              vehicle.lastRenderedHeading,
              targetHeading
            );

          if (
            Math.abs(delta) <
            0.15
          ) {
            return;
          }

          const rotatedSymbol =
            vehicle.graphic.symbol
              .clone();

          const rotatedLayer =
            rotatedSymbol
              .symbolLayers
              .getItemAt(0);

          rotatedLayer.heading =
            targetHeading;

          vehicle.graphic.symbol =
            rotatedSymbol;

          vehicle.lastRenderedHeading =
            targetHeading;
        }

        // ======================================================
        // ANIMATION
        // ======================================================

        const animationStart =
          performance.now();

        let lastLog =
          0;

        setStatus(
          vehicles.length +
          " véhicules en circulation",
          "ok"
        );

        console.log(
          "Animation démarrée :",
          vehicles.length,
          "véhicules"
        );

        function animate(
          currentTime
        ) {
          try {
            const elapsedSeconds =
              (
                currentTime -
                animationStart
              )
              /
              1000;

            for (
              const vehicle
              of vehicles
            ) {
              // ------------------------------------------------
              // BOUCLE SIMPLE :
              // début -> fin -> retour instantané au début.
              // Aucune marche arrière.
              // ------------------------------------------------

              const travelled =
                vehicle.startDistance
                +
                elapsedSeconds
                *
                vehicle.speedMs;

              const currentDistance =
                travelled
                %
                vehicle.route.totalLength;

              const position =
                pointAtDistance(
                  vehicle.route,
                  currentDistance
                );

              vehicle.graphic.geometry =
                new Point({
                  x:
                    position.x,

                  y:
                    position.y,

                  spatialReference:
                    view.spatialReference
                });

              const targetHeading =
                smoothHeading(
                  vehicle.route,
                  currentDistance,
                  view.spatialReference
                );

              updateVehicleHeading(
                vehicle,
                targetHeading
              );
            }

            if (
              currentTime -
              lastLog >
              5000
            ) {
              console.log(
                "Animation OK :",
                vehicles.length,
                "véhicules"
              );

              lastLog =
                currentTime;
            }

            requestAnimationFrame(
              animate
            );
          }
          catch (animationError) {
            console.error(
              "Erreur animation :",
              animationError
            );

            setStatus(
              "Erreur animation - F12",
              "error"
            );
          }
        }

        requestAnimationFrame(
          animate
        );
      }
      catch (error) {
        console.error(
          "ERREUR GÉNÉRALE :",
          error
        );

        setStatus(
          "Erreur - voir F12 / Console",
          "error"
        );
      }
    }

    main();
  </script>
</body>
</html>
